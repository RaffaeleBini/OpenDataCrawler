[project]
name = "ckanext-igeharvester"
version = "0.1.0"
description = "Harvester a medida para a API REST do IGE (Instituto Galego de Estatistica), para DATAlife"
requires-python = ">=3.9"
dependencies = [
  "ckantoolkit",
  "requests",
]

[project.entry-points."ckan.plugins"]
ige_harvester = "ckanext.igeharvester.plugin:IGEHarvester"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ckanext*"]
