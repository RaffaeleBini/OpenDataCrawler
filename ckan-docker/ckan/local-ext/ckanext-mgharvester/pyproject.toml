[project]
name = "ckanext-mgharvester"
version = "0.1.0"
description = "Harvester a medida para a API JSON de MeteoGalicia, para DATAlife"
requires-python = ">=3.9"
dependencies = [
  "ckantoolkit",
  "requests",
]

[project.entry-points."ckan.plugins"]
mg_harvester = "ckanext.mgharvester.plugin:MGHarvester"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ckanext*"]
